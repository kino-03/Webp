<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>:hover 활용</title>

    <style>
        body {
            background-color: white;
            color: black;
        }

        #card {
            width: 150px;
            height: 200px;
            background-image: url("back.png");
            background-size: 150px 200px;
        }

        #card:hover {
            background-image: url("front.png");
        }
    </style>
</head>

<body>

    <h3>:hover 활용</h3>
    <hr>

    <p>
        마우스를 올리면<br>
        카드의 앞면이 보<br>
        인다.
    </p>

    <div id="card"></div>

</body>
</html>
