<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>text-shadow와 box-shadow</title>

    <style>
        h3 {
            text-align: center;
            color: yellow;
            font-size: 30px;
            text-shadow: 3px 3px 3px gray;
        }

        img {
            width: 140px;
            height: 100px;
            margin: 5px;
        }

        img:hover {
            box-shadow: 0px 0px 10px blue;
        }
    </style>
</head>

<body>

    <h3>Most Visited Pages</h3>
    <hr>

    <img src="naver.jpg">
    <img src="chosun.jpg">
    <img src="amazon.jpg">

</body>
</html>
