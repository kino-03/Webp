<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>스마트폰에 관한 설문</title>
    <link rel="stylesheet" href="survey4.css">
</head>
<body>

<header>
    <h1>설문지</h1>
    <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
</header>

<section>
    <form>
        <p>
            학년
            <label><input type="radio" name="grade" value="1">1학년</label>
            <label><input type="radio" name="grade" value="2">2학년</label>
            <label><input type="radio" name="grade" value="3">3학년</label>
            <label><input type="radio" name="grade" value="4">4학년</label>
        </p>

        <p>
            성별
            <label><input type="radio" name="gender" value="male">남</label>
            <label><input type="radio" name="gender" value="female">여</label>
        </p>

        <p>
            관심 분야
            <select name="interest">
                <option>모바일 소프트웨어</option>
                <option>웹 서비스</option>
                <option>빅데이터</option>
                <option>디지털 콘텐츠</option>
            </select>
        </p>

        <p>
            진로
            <label><input type="checkbox" name="career" value="development">개발</label>
            <label><input type="checkbox" name="career" value="planning">기획</label>
            <label><input type="checkbox" name="career" value="sales">영업</label>
            <label><input type="checkbox" name="career" value="startup">창업</label>
        </p>

        <p>남기고 싶은 말</p>
        <textarea cols="40" rows="5" placeholder="글을 남겨주세요"></textarea>
    </form>
</section>

<footer>
    <p>Copyright 2022 by Kitae</p>
</footer>

</body>
</html>
