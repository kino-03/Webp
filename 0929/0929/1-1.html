<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>div</title>
<style>
    div {
        display: inline-block;
        width: 200px;
        height: 100px;
        border: 1px solid green;
        vertical-align: top;
        box-sizing: border-box;
        padding: 5px;
    }
</style>
</head>
<body>

<h3>3개의 div 활용</h3>
<hr>

<div>캔버스에 이미지를 그리기 위해서는 이미지를 객체 형태로 만들어야 한다.</div>
<div>Image 객체의 src 프로퍼티를 이용하여 비트맵을 로드한다.</div>
<div>이미지 로딩이 끝나면 그때 비로소 이미지의 너비와 높이가 제대로 알려진다.</div>

</body>
</html>
