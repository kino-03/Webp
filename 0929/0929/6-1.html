<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>animation</title>

<style>
@keyframes rotate {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

img {
    animation: rotate 1s infinite;
}
</style>
</head>

<body>

<h3>어지러워요</h3>
<hr>

<img src="스폰지밥.jpg" width="120">

</body>
</html>
