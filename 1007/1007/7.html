<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>큰 자리수와 낮은자리수 비교</title>
</head>
<body>
<h3>큰 자리수와 낮은자리수 같은지 비교</h3>
<hr>
<script>
    let num = prompt("숫자 입력");
    let n = parseInt(num);

    let last = n % 10;

    while(n >= 10) {
        n = Math.floor(n / 10);
    }

    if(n == last) {
        document.write(num + ": 같음");
    }
    else {
        document.write(num + ": 다름");
    }
</script>
</body>
</html>
