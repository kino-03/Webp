<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>transform rotate()</title>
</head>
<body>
    <h3>클릭하면 90도 회전합니다.</h3>
    <hr>

    <img src="media/spongebob.png"
         width="100" height="100"
         onclick="rotate(this)">

    <script>
        let angle = 0;

        function rotate(obj) {
            angle += 90;
            obj.style.transform = "rotate(" + angle + "deg)";
        }
    </script>
</body>
</html>
