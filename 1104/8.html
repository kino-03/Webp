<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>transform:scale()</title>
</head>
<body>
    <h3>클릭하면 2,3,4배로 옆으로 늘어납니다.</h3>
    <hr>

    <img src="media/spongebob.png"
         width="100" height="100"
         onclick="changeSize(this)">

    <script>
        let size = 1;

        function changeSize(obj) {
            size++;
            obj.style.transform = "scale(" + size + ",1)";
            obj.style.transformOrigin = "left center";
        }
    </script>
</body>
</html>
