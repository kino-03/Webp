<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>이미지 커서 만들기</title>

    <script>
        function moveImage(e) {
            let img = document.getElementById("cursor");

            img.style.left = e.clientX + "px";
            img.style.top = e.clientY + "px";
        }

        window.onmousemove = moveImage;
    </script>

    <style>
        #cursor {
            position: absolute;
            width: 30px;
            height: 30px;
        }
    </style>
</head>

<body>
    <h3>이미지 커서 만들기</h3>
    <hr>

    <img id="cursor" src="cursor.png">

    <p>마우스를 움직이면 이미지로 만든 커서가 마우스를 따라 다닙니다.</p>
</body>
</html>
