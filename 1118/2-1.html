<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML5</title>
<script>
function printWelcome() {
    let win = window.open("", "", "width=200,height=80,left=500,top=400");
    win.document.write("접속 감사합니다!<br>");
    win.document.write("열심히 하세요!");
    win.document.close();
}
</script>
</head>
<body onload="printWelcome()">
<p>
접속 감사합니다!<br>
열심히 하세요!
</p>
</body>
</html>
