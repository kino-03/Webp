<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>사이트 접속</title>
</head>

<body>

<h3>옵션 선택으로 사이트 접속</h3>
<p>옵션 선택 마다 새 윈도우에 접속합니다.</p>
<hr>

<p>접속할 사이트</p>

<select onchange="openSite(this.value)">
    <option value="https://www.naver.com">네이버</option>
    <option value="https://www.google.co.kr">구글</option>
    <option value="https://www.oracle.com">오라클</option>
</select>

<script>
function openSite(url) {
    window.open(url, "_blank");
}
</script>

</body>
</html>
