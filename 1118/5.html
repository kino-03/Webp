<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>시계 만들기</title>

<script>
let timer = null;

function clock() {
    clearTimeout(timer);

    let now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();

    let ampm = hours >= 12 ? "오후" : "오전";

    hours = hours % 12;
    if (hours == 0) {
        hours = 12;
    }

    let time = ampm + " " + hours + ":" + minutes + ":" + seconds;

    document.getElementById("clock").innerHTML = time;

    timer = setTimeout(clock, 1000);
}
</script>

</head>

<body onload="clock()">

<h3>div 태그에 시계 만들기</h3>
<hr>

<div id="clock"></div>

</body>
</html>
