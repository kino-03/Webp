<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>시계 만들기</title>

<style>
#clock {
    display: inline-block;
    border: 1px solid gray;
    padding: 5px;
    cursor: pointer;
}
</style>

<script>
let timer = null;
let running = true;

function clock() {
    let now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();
    let seconds = now.getSeconds();

    let ampm = hours >= 12 ? "오후" : "오전";

    hours = hours % 12;
    if (hours == 0) {
        hours = 12;
    }

    let time = ampm + " " + hours + ":" + minutes + ":" + seconds;

    document.getElementById("clock").innerHTML = time;
}

function startClock() {
    if (timer == null) {
        clock();
        timer = setInterval(clock, 1000);
        running = true;
    }
}

function stopClock() {
    clearInterval(timer);
    timer = null;
    running = false;
}

function toggleClock() {
    if (running) {
        stopClock();
    } else {
        startClock();
    }
}
</script>

</head>

<body onload="startClock()">

<h3>div 태그에 시계 만들기</h3>
<p>시계를 클릭하면 시계가 멈추고 다시 클릭하면 가기 시작한다.</p>
<hr>

<div id="clock" onclick="toggleClock()"></div>

</body>
</html>
