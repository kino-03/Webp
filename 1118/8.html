<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>산수를 풀어 봅시다</title>
</head>

<body onload="makeQuiz()">

<h3>산수 문제를 풀어 봅시다.</h3>

<p>
문제는 자동으로 생성되며, 10초가 지나면 자동 채점됩니다.
<br>
남은 시간 <span id="time">10</span>
</p>

<hr>

<div id="quiz"></div>

<button onclick="makeQuiz()">다시</button>
<span id="score">0</span>

<script>
let answers = [];
let timer;

function makeQuiz() {
    clearInterval(timer);

    let quiz = document.getElementById("quiz");
    let operators = ["+", "-", "*", "-"];

    answers = [];
    quiz.innerHTML = "";
    document.getElementById("score").innerHTML = 0;

    for (let i = 0; i < 4; i++) {
        let a = Math.floor(Math.random() * 20) + 1;
        let b = Math.floor(Math.random() * 20) + 1;
        let op = operators[Math.floor(Math.random() * 4)];

        let answer;

        if (op == "+") {
            answer = a + b;
        } else if (op == "-") {
            answer = a - b;
        } else {
            answer = a * b;
        }

        answers.push(answer);

        quiz.innerHTML +=
            "<div>" +
            "<span id='q" + i + "'>" + a + op + b + "</span> " +
            "<input type='text' id='a" + i + "'>" +
            "</div>";
    }

    let time = 10;
    document.getElementById("time").innerHTML = time;

    timer = setInterval(function() {
        time--;
        document.getElementById("time").innerHTML = time;

        if (time <= 0) {
            clearInterval(timer);
            check();
        }
    }, 1000);
}

function check() {
    let count = 0;

    for (let i = 0; i < 4; i++) {
        let user = document.getElementById("a" + i).value;
        let question = document.getElementById("q" + i);

        if (user.trim() !== "" && Number(user) == answers[i]) {
            count++;
        } else {
            question.style.textDecoration = "line-through";
        }
    }

    document.getElementById("score").innerHTML = count;
}
</script>

</body>
</html>
